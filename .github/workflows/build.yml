
name: Build Spicord AdvancedBan Addon

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout addon source
        uses: actions/checkout@v5

      - name: Checkout Spicord source
        uses: actions/checkout@v5
        with:
          repository: Spicord/Spicord
          ref: v5
          path: Spicord

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and install Spicord API
        run: mvn --batch-mode -f Spicord/pom.xml -pl common -am install -DskipTests

      - name: Build addon
        run: mvn --batch-mode clean package

      - name: Upload addon JAR
        uses: actions/upload-artifact@v4
        with:
          name: Spicord-AdvancedBan-Addon
          path: target/Spicord-AdvancedBan-Addon.jar
          
