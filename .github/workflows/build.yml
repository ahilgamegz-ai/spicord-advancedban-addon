name: Build Spicord AdvancedBan Addon

'on':
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout addon repository
    uses: actions/checkout@v4

  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Check addon project files
    run: |
      echo "Checking repository files..."
      ls -la
      if [ ! -f pom.xml ]; then
        echo "ERROR: pom.xml has not been added yet."
        exit 1
      fi

  - name: Build addon
    run: mvn -B clean package

  - name: Upload build output
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: addon-build-output
      path: target/
      if-no-files-found: error
